name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin manifests and frontmatter
        run: python3 scripts/validate.py
      - name: Smoke-test the SessionStart hook
        run: bash scripts/session-start.sh
